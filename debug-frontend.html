<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>前端调试 - 详细CORS诊断</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            background: #1e1e1e;
            color: #d4d4d4;
        }
        .section {
            margin: 20px 0;
            padding: 15px;
            background: #252526;
            border-left: 3px solid #007acc;
            border-radius: 3px;
        }
        .success { border-left-color: #4ec9b0; }
        .error { border-left-color: #f48771; }
        .warning { border-left-color: #dcdcaa; }
        button {
            padding: 10px 20px;
            margin: 5px;
            background: #007acc;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-family: inherit;
        }
        button:hover { background: #005a9e; }
        pre {
            background: #1e1e1e;
            padding: 10px;
            border-radius: 3px;
            overflow-x: auto;
            font-size: 12px;
        }
        input {
            padding: 8px;
            margin: 5px;
            width: 300px;
            background: #3c3c3c;
            border: 1px solid #555;
            color: #d4d4d4;
            border-radius: 3px;
        }
        h1 { color: #4ec9b0; }
        h2 { color: #dcdcaa; }
        .log { 
            font-size: 11px;
            color: #858585;
            margin: 5px 0;
        }
        .log.error { color: #f48771; }
        .log.success { color: #4ec9b0; }
        .log.info { color: #4fc1ff; }
    </style>
</head>
<body>
    <h1>🔍 前端CORS详细诊断</h1>
    
    <div class="section">
        <h2>环境信息</h2>
        <pre id="envInfo">加载中...</pre>
    </div>

    <div class="section">
        <h2>1. 完整登录测试（带详细日志）</h2>
        <div>
            <input type="email" id="email" placeholder="Email" value="test@example.com">
            <input type="password" id="password" placeholder="Password" value="password12345678">
        </div>
        <button onclick="detailedLoginTest()">详细登录测试</button>
        <button onclick="clearLogs()">清除日志</button>
        <div id="loginLogs"></div>
    </div>

    <div class="section">
        <h2>2. CORS预检详细分析</h2>
        <button onclick="corsPreflightTest()">测试CORS预检</button>
        <div id="corsLogs"></div>
    </div>

    <div class="section">
        <h2>3. 网络请求拦截</h2>
        <button onclick="interceptFetch()">启用Fetch拦截</button>
        <button onclick="disableIntercept()">禁用拦截</button>
        <div id="interceptLogs"></div>
    </div>

    <div class="section">
        <h2>4. 浏览器兼容性检查</h2>
        <button onclick="checkBrowserCompat()">检查兼容性</button>
        <div id="compatLogs"></div>
    </div>

    <script>
        const API_URL = 'https://shopline-one-api.xyvn.workers.dev';
        let originalFetch = window.fetch;
        let interceptEnabled = false;

        // 显示环境信息
        function showEnvInfo() {
            const info = {
                userAgent: navigator.userAgent,
                origin: window.location.origin,
                protocol: window.location.protocol,
                apiUrl: API_URL,
                cookiesEnabled: navigator.cookieEnabled,
                language: navigator.language,
                onLine: navigator.onLine
            };
            document.getElementById('envInfo').textContent = JSON.stringify(info, null, 2);
        }

        // 日志函数
        function log(containerId, message, type = 'info') {
            const container = document.getElementById(containerId);
            const logDiv = document.createElement('div');
            logDiv.className = `log ${type}`;
            logDiv.textContent = `[${new Date().toISOString()}] ${message}`;
            container.appendChild(logDiv);
            container.scrollTop = container.scrollHeight;
        }

        function clearLogs() {
            document.getElementById('loginLogs').innerHTML = '';
        }

        // 详细登录测试
        async function detailedLoginTest() {
            const logsId = 'loginLogs';
            clearLogs();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            log(logsId, `开始登录测试...`, 'info');
            log(logsId, `Email: ${email}`, 'info');
            log(logsId, `API URL: ${API_URL}/api/auth/login`, 'info');
            log(logsId, `Origin: ${window.location.origin}`, 'info');
            
            try {
                log(logsId, `创建请求...`, 'info');
                
                const requestOptions = {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    credentials: 'include',
                    body: JSON.stringify({ email, password })
                };
                
                log(logsId, `请求配置: ${JSON.stringify(requestOptions, null, 2)}`, 'info');
                log(logsId, `发送请求...`, 'info');
                
                const startTime = Date.now();
                const response = await fetch(`${API_URL}/api/auth/login`, requestOptions);
                const endTime = Date.now();
                
                log(logsId, `响应时间: ${endTime - startTime}ms`, 'info');
                log(logsId, `响应状态: ${response.status} ${response.statusText}`, response.ok ? 'success' : 'error');
                
                // 记录所有响应头
                log(logsId, `响应头:`, 'info');
                response.headers.forEach((value, key) => {
                    log(logsId, `  ${key}: ${value}`, 'info');
                });
                
                // 读取响应体
                const contentType = response.headers.get('content-type');
                log(logsId, `Content-Type: ${contentType}`, 'info');
                
                let data;
                if (contentType && contentType.includes('application/json')) {
                    data = await response.json();
                    log(logsId, `响应数据: ${JSON.stringify(data, null, 2)}`, response.ok ? 'success' : 'error');
                } else {
                    data = await response.text();
                    log(logsId, `响应文本: ${data}`, 'error');
                }
                
                if (response.ok && data.token) {
                    log(logsId, `✅ 登录成功！`, 'success');
                    log(logsId, `Token: ${data.token.substring(0, 50)}...`, 'success');
                    localStorage.setItem('auth_token', data.token);
                    log(logsId, `Token已保存到localStorage`, 'success');
                } else {
                    log(logsId, `❌ 登录失败`, 'error');
                }
                
            } catch (error) {
                log(logsId, `❌ 捕获到错误:`, 'error');
                log(logsId, `错误类型: ${error.name}`, 'error');
                log(logsId, `错误消息: ${error.message}`, 'error');
                log(logsId, `错误堆栈: ${error.stack}`, 'error');
                
                // 检查是否是CORS错误
                if (error.message.includes('CORS') || error.message.includes('fetch')) {
                    log(logsId, ``, 'error');
                    log(logsId, `🔴 这是一个CORS错误！`, 'error');
                    log(logsId, `可能的原因:`, 'error');
                    log(logsId, `1. API服务器的ALLOWED_ORIGINS配置不包含当前域名`, 'error');
                    log(logsId, `2. 请求头包含了不被允许的字段`, 'error');
                    log(logsId, `3. 浏览器扩展程序干扰了请求`, 'error');
                    log(logsId, `4. 网络代理或防火墙拦截了请求`, 'error');
                }
            }
        }

        // CORS预检测试
        async function corsPreflightTest() {
            const logsId = 'corsLogs';
            document.getElementById(logsId).innerHTML = '';
            
            log(logsId, `开始CORS预检测试...`, 'info');
            
            try {
                const response = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'OPTIONS',
                    headers: {
                        'Access-Control-Request-Method': 'POST',
                        'Access-Control-Request-Headers': 'Content-Type'
                    }
                });
                
                log(logsId, `预检响应状态: ${response.status}`, response.ok ? 'success' : 'error');
                
                const allowOrigin = response.headers.get('access-control-allow-origin');
                const allowMethods = response.headers.get('access-control-allow-methods');
                const allowHeaders = response.headers.get('access-control-allow-headers');
                const allowCredentials = response.headers.get('access-control-allow-credentials');
                
                log(logsId, `Allow-Origin: ${allowOrigin}`, allowOrigin ? 'success' : 'error');
                log(logsId, `Allow-Methods: ${allowMethods}`, 'info');
                log(logsId, `Allow-Headers: ${allowHeaders}`, 'info');
                log(logsId, `Allow-Credentials: ${allowCredentials}`, 'info');
                
                if (allowOrigin === window.location.origin || allowOrigin === '*') {
                    log(logsId, `✅ CORS配置正确`, 'success');
                } else {
                    log(logsId, `❌ CORS配置错误: 当前origin不在允许列表中`, 'error');
                    log(logsId, `当前origin: ${window.location.origin}`, 'error');
                    log(logsId, `允许的origin: ${allowOrigin}`, 'error');
                }
                
            } catch (error) {
                log(logsId, `❌ 预检失败: ${error.message}`, 'error');
            }
        }

        // 拦截fetch请求
        function interceptFetch() {
            if (interceptEnabled) return;
            
            interceptEnabled = true;
            const logsId = 'interceptLogs';
            document.getElementById(logsId).innerHTML = '';
            log(logsId, `✅ Fetch拦截已启用`, 'success');
            
            window.fetch = function(...args) {
                log(logsId, `📤 Fetch请求:`, 'info');
                log(logsId, `  URL: ${args[0]}`, 'info');
                if (args[1]) {
                    log(logsId, `  Method: ${args[1].method || 'GET'}`, 'info');
                    log(logsId, `  Headers: ${JSON.stringify(args[1].headers || {})}`, 'info');
                }
                
                return originalFetch.apply(this, args)
                    .then(response => {
                        log(logsId, `📥 Fetch响应:`, response.ok ? 'success' : 'error');
                        log(logsId, `  Status: ${response.status}`, response.ok ? 'success' : 'error');
                        return response;
                    })
                    .catch(error => {
                        log(logsId, `❌ Fetch错误: ${error.message}`, 'error');
                        throw error;
                    });
            };
        }

        function disableIntercept() {
            window.fetch = originalFetch;
            interceptEnabled = false;
            log('interceptLogs', `⏸️  Fetch拦截已禁用`, 'warning');
        }

        // 浏览器兼容性检查
        function checkBrowserCompat() {
            const logsId = 'compatLogs';
            document.getElementById(logsId).innerHTML = '';
            
            log(logsId, `检查浏览器兼容性...`, 'info');
            
            const checks = {
                'Fetch API': typeof fetch !== 'undefined',
                'Promise': typeof Promise !== 'undefined',
                'localStorage': typeof localStorage !== 'undefined',
                'JSON': typeof JSON !== 'undefined',
                'CORS': typeof XMLHttpRequest !== 'undefined' && 'withCredentials' in new XMLHttpRequest(),
            };
            
            for (const [feature, supported] of Object.entries(checks)) {
                log(logsId, `${feature}: ${supported ? '✅ 支持' : '❌ 不支持'}`, supported ? 'success' : 'error');
            }
            
            // 检查浏览器扩展
            log(logsId, ``, 'info');
            log(logsId, `建议检查的浏览器扩展:`, 'warning');
            log(logsId, `- 广告拦截器 (AdBlock, uBlock Origin)`, 'warning');
            log(logsId, `- 隐私保护 (Privacy Badger, Ghostery)`, 'warning');
            log(logsId, `- VPN或代理扩展`, 'warning');
            log(logsId, ``, 'info');
            log(logsId, `尝试在无痕模式下测试以排除扩展干扰`, 'warning');
        }

        // 初始化
        showEnvInfo();
    </script>
</body>
</html>
