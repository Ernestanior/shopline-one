<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录测试 - CORS诊断</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-section {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        .info { background-color: #d1ecf1; border-color: #bee5eb; }
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }
        pre {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 3px;
            overflow-x: auto;
        }
        input {
            padding: 8px;
            margin: 5px;
            width: 300px;
        }
    </style>
</head>
<body>
    <h1>🔍 登录测试 & CORS诊断</h1>
    
    <div class="test-section info">
        <h2>测试配置</h2>
        <p><strong>API URL:</strong> <span id="apiUrl">https://shopline-one-api.xyvn.workers.dev</span></p>
        <p><strong>当前Origin:</strong> <span id="currentOrigin"></span></p>
    </div>

    <div class="test-section">
        <h2>1. CORS预检测试 (OPTIONS)</h2>
        <button onclick="testCorsPreFlight()">测试CORS预检</button>
        <pre id="corsResult">点击按钮开始测试...</pre>
    </div>

    <div class="test-section">
        <h2>2. 登录测试</h2>
        <div>
            <input type="email" id="email" placeholder="Email" value="test@example.com">
            <input type="password" id="password" placeholder="Password" value="test123">
        </div>
        <button onclick="testLogin()">测试登录</button>
        <pre id="loginResult">输入凭证后点击测试...</pre>
    </div>

    <div class="test-section">
        <h2>3. 获取产品列表（无需认证）</h2>
        <button onclick="testProducts()">测试获取产品</button>
        <pre id="productsResult">点击按钮开始测试...</pre>
    </div>

    <div class="test-section">
        <h2>4. 数据库用户列表</h2>
        <p>远程数据库中的用户：</p>
        <ul>
            <li>siyuananior@gmail.com (普通用户)</li>
            <li>test@example.com (管理员)</li>
            <li>seedlight2899@gmail.com (普通用户)</li>
        </ul>
    </div>

    <script>
        const API_URL = 'https://shopline-one-api.xyvn.workers.dev';
        
        // 显示当前origin
        document.getElementById('currentOrigin').textContent = window.location.origin;

        async function testCorsPreFlight() {
            const resultEl = document.getElementById('corsResult');
            resultEl.textContent = '测试中...';
            
            try {
                const response = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'OPTIONS',
                    headers: {
                        'Origin': window.location.origin,
                        'Access-Control-Request-Method': 'POST',
                        'Access-Control-Request-Headers': 'Content-Type'
                    }
                });

                const headers = {};
                response.headers.forEach((value, key) => {
                    headers[key] = value;
                });

                resultEl.textContent = JSON.stringify({
                    status: response.status,
                    statusText: response.statusText,
                    headers: headers
                }, null, 2);
                
                resultEl.parentElement.className = 'test-section ' + (response.ok ? 'success' : 'error');
            } catch (error) {
                resultEl.textContent = `错误: ${error.message}\n\n${error.stack}`;
                resultEl.parentElement.className = 'test-section error';
            }
        }

        async function testLogin() {
            const resultEl = document.getElementById('loginResult');
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            resultEl.textContent = '登录中...';
            
            try {
                const response = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    credentials: 'include',
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();
                
                resultEl.textContent = JSON.stringify({
                    status: response.status,
                    statusText: response.statusText,
                    data: data
                }, null, 2);
                
                resultEl.parentElement.className = 'test-section ' + (response.ok ? 'success' : 'error');
                
                if (response.ok && data.token) {
                    localStorage.setItem('token', data.token);
                    resultEl.textContent += '\n\n✅ Token已保存到localStorage';
                }
            } catch (error) {
                resultEl.textContent = `错误: ${error.message}\n\n完整错误:\n${JSON.stringify(error, null, 2)}`;
                resultEl.parentElement.className = 'test-section error';
            }
        }

        async function testProducts() {
            const resultEl = document.getElementById('productsResult');
            resultEl.textContent = '获取中...';
            
            try {
                const response = await fetch(`${API_URL}/api/products`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });

                const data = await response.json();
                
                resultEl.textContent = JSON.stringify({
                    status: response.status,
                    statusText: response.statusText,
                    productsCount: data.products ? data.products.length : 0,
                    firstProduct: data.products ? data.products[0] : null
                }, null, 2);
                
                resultEl.parentElement.className = 'test-section ' + (response.ok ? 'success' : 'error');
            } catch (error) {
                resultEl.textContent = `错误: ${error.message}\n\n${error.stack}`;
                resultEl.parentElement.className = 'test-section error';
            }
        }
    </script>
</body>
</html>
